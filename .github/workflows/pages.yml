name: Publish Tesserakt
on:
  push:
    branches: [main]
    paths: ['site/**', 'portal/**', 'scripts/build-site.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tesserakt-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and metadata
        run: |
          node --check site/scene.js
          python -m json.tool portal/metadata.json > /dev/null
      - name: Build presentation only
        run: python scripts/build-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
